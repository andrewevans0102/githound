name: Issue Guard

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  guard:
    if: github.actor != github.repository_owner && github.event.issue.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action
        uses: actions/checkout@v4

      - name: Guard Non-Owner Issue
        uses: ./issue-guard


name: Issue Guard

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  guard:
    if: github.actor != github.repository_owner && github.event.issue.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Reject and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🐾 GitHound only accepts issues opened by the repository owner. This issue has been automatically closed.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              lock_reason: 'resolved'
            });
